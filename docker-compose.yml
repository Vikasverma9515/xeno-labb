services:
  db:
    image: postgres:16
    container_name: xeno_lab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: xeno
      POSTGRES_PASSWORD: xeno_local_dev
      POSTGRES_DB: xeno_lab
    ports:
      - "5433:5432"
    volumes:
      - xeno_lab_pgdata:/var/lib/postgresql/data

volumes:
  xeno_lab_pgdata:
